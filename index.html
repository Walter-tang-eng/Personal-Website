<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Walter-tang-eng 的个人主页。姓名、简介、项目和联系方式留待填写。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4efe6">
    <title>个人主页 · Walter-tang-eng</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!--
      填写位置：
      1. 姓名（h1）
      2. 简介
      3. 项目（article.project 可整块复制）
      4. 联系方式中的邮箱、其他
      页眉的 Walter-tang-eng 是 GitHub 登录名，不是姓名。
    -->
    <a class="skip" href="#content">跳到正文</a>
    <header class="site-header">
      <a class="wordmark" rel="me" href="https://github.com/Walter-tang-eng">
        Walter-tang-eng
        <small>GitHub 登录名</small>
      </a>
      <nav aria-label="页内">
        <a href="#intro">简介</a>
        <a href="#projects">项目</a>
        <a href="#contact">联系</a>
      </nav>
    </header>

    <main id="content">
      <section class="hero" aria-labelledby="name-label">
        <p class="seal" id="name-label">姓名</p>
        <h1 class="slot">在这里写上你的名字</h1>
        <p class="hint">页眉上的 Walter-tang-eng 是 GitHub 登录名，这一行才是姓名。</p>
      </section>

      <section id="intro" aria-labelledby="intro-label">
        <h2 id="intro-label"><span class="mark" aria-hidden="true"></span>简介</h2>
        <p class="slot-card">用两三句话介绍自己。</p>
      </section>

      <section id="projects" aria-labelledby="projects-label">
        <h2 id="projects-label"><span class="mark" aria-hidden="true"></span>项目</h2>
        <p class="section-note">还没有项目。写好下面这一条后，把整块复制一份，就能再加一条。</p>
        <article class="project">
          <div class="project-head">
            <span class="index">01</span>
            <span class="chip">待填写</span>
          </div>
          <dl>
            <div>
              <dt>名称</dt>
              <dd class="slot">项目名称</dd>
            </div>
            <div>
              <dt>说明</dt>
              <dd class="slot">用一句话说明这个项目。</dd>
            </div>
            <div>
              <dt>链接</dt>
              <dd class="slot">项目链接</dd>
            </div>
          </dl>
        </article>
      </section>

      <section id="contact" aria-labelledby="contact-label">
        <h2 id="contact-label"><span class="mark" aria-hidden="true"></span>联系</h2>
        <dl class="contact">
          <div>
            <dt>GitHub</dt>
            <dd><a rel="me" href="https://github.com/Walter-tang-eng">Walter-tang-eng</a></dd>
          </div>
          <div>
            <dt>邮箱</dt>
            <dd class="slot">填上你的邮箱</dd>
          </div>
          <div>
            <dt>其他</dt>
            <dd class="slot">填上其他联系方式</dd>
          </div>
        </dl>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        <a href="https://github.com/Walter-tang-eng/Personal-Website">Personal-Website</a>
      </p>
      <p>姓名、简介、项目和其余联系方式留待填写。</p>
    </footer>
  </body>
</html>
